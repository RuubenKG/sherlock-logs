---
- name: Run Node Exporter container
  community.docker.docker_container:
    name: node_exporter
    image: prom/node-exporter:v1.8.2
    state: started
    restart_policy: always
    pid_mode: host
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'