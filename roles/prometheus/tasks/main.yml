---
- name: Create Prometheus config directory
  file:
    path: /opt/monitoring/prometheus
    state: directory
    owner: devops
    group: devops
    mode: '0755'

- name: Template Prometheus configuration
  template:
    src: prometheus.yml.j2
    dest: /opt/monitoring/prometheus/prometheus.yml
    owner: devops
    group: devops
    mode: '0644'
  notify: Restart Prometheus

- name: Copy Prometheus alert rules
  copy:
    src: alert_rules.yml
    dest: /opt/monitoring/prometheus/alert_rules.yml
    owner: devops
    group: devops
    mode: '0644'
  notify: Restart Prometheus

- name: Run Prometheus container
  community.docker.docker_container:
    name: prometheus
    image: prom/prometheus:v2.53.1
    state: started
    restart_policy: always
    ports:
      - "9090:9090"
    volumes:
      - /opt/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - /opt/monitoring/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'

- name: Allow Prometheus UI port 9090
  ufw:
    rule: allow
    port: '9090'
    proto: tcp