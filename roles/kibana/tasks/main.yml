---
- name: Create Kibana config directory
  file:
    path: /opt/monitoring/kibana
    state: directory
    owner: devops
    group: devops
    mode: '0755'

- name: Run Kibana container
  community.docker.docker_container:
    name: kibana
    image: docker.elastic.co/kibana/kibana:8.14.1
    state: started
    restart_policy: unless-stopped
    networks:
      - name: elk
    env:
      ELASTICSEARCH_HOSTS: "http://elasticsearch1:9200"
      SERVER_NAME: "kibana"
      SERVER_HOST: "0.0.0.0"
    ports:
      - "5601:5601"

- name: Allow Kibana UI port 5601 from monitoring subnet
  ufw:
    rule: allow
    from_ip: 192.168.56.0/24
    port: '5601'
    proto: tcp

- name: Copy Kibana saved objects export
  copy:
    src: export.ndjson
    dest: /opt/monitoring/kibana/export.ndjson
    owner: devops
    group: devops
    mode: '0644'

- name: Wait for Kibana API to be ready
  uri:
    url: "http://192.168.56.16:5601/api/status"
    method: GET
    status_code: 200
  register: kibana_status
  retries: 30
  delay: 10
  until: kibana_status.status == 200

- name: Import Kibana dashboards and data view
  shell: >
    curl -s -X POST "http://192.168.56.16:5601/api/saved_objects/_import?overwrite=true"
    -H "kbn-xsrf: true"
    --form file=@/opt/monitoring/kibana/export.ndjson
  register: kibana_import
  changed_when: "'\"success\":true' in kibana_import.stdout"