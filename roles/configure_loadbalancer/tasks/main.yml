---
- name: Install nginx
  apt:
    name: nginx
    state: present

- name: Copy nginx config
  copy:
    src: "{{ playbook_dir }}/../infrastructure-insight/loadbalancer/nginx.conf"
    dest: /etc/nginx/conf.d/default.conf
    owner: root
    group: root
    mode: '0644'
  notify: Restart nginx

- name: Remove default nginx site
  file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Restart nginx

- name: Start and enable nginx
  service:
    name: nginx
    state: started
    enabled: yes