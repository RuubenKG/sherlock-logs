---
- name: Set vm.max_map_count for Elasticsearch
  sysctl:
    name: vm.max_map_count
    value: '262144'
    state: present
    reload: yes

- name: Create Elasticsearch data directories
  file:
    path: "{{ item }}"
    state: directory
    owner: '1000'
    group: '1000'
    mode: '0755'
  loop:
    - /opt/monitoring/elasticsearch/node1
    - /opt/monitoring/elasticsearch/node2

- name: Create Docker network for ELK
  community.docker.docker_network:
    name: elk
    state: present

- name: Run Elasticsearch node 1
  community.docker.docker_container:
    name: elasticsearch1
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.1
    state: started
    restart_policy: unless-stopped
    networks:
      - name: elk
    env:
      node.name: "elasticsearch1"
      cluster.name: "sherlock-cluster"
      discovery.seed_hosts: "elasticsearch2"
      cluster.initial_master_nodes: "elasticsearch1,elasticsearch2"
      bootstrap.memory_lock: "true"
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms1g -Xmx1g"
    ulimits:
      - "memlock:-1:-1"
    volumes:
      - /opt/monitoring/elasticsearch/node1:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"

- name: Run Elasticsearch node 2
  community.docker.docker_container:
    name: elasticsearch2
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.1
    state: started
    restart_policy: unless-stopped
    networks:
      - name: elk
    env:
      node.name: "elasticsearch2"
      cluster.name: "sherlock-cluster"
      discovery.seed_hosts: "elasticsearch1"
      cluster.initial_master_nodes: "elasticsearch1,elasticsearch2"
      bootstrap.memory_lock: "true"
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms1g -Xmx1g"
    ulimits:
      - "memlock:-1:-1"
    volumes:
      - /opt/monitoring/elasticsearch/node2:/usr/share/elasticsearch/data

- name: Allow Elasticsearch HTTP port 9200 from monitoring subnet
  ufw:
    rule: allow
    from_ip: 192.168.56.0/24
    port: '9200'
    proto: tcp

- name: Run Elasticsearch exporter
  community.docker.docker_container:
    name: elasticsearch_exporter
    image: quay.io/prometheuscommunity/elasticsearch-exporter:v1.7.0
    state: started
    restart_policy: always
    networks:
      - name: elk
    ports:
      - "9114:9114"
    command:
      - '--es.uri=http://elasticsearch1:9200'

- name: Allow Elasticsearch exporter port 9114
  ufw:
    rule: allow
    port: '9114'
    proto: tcp