server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Diagnostic JSON lives at /api/info on the backend (was /metrics).
    location /api/info {
        proxy_pass http://192.168.56.10:3000/api/info;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}