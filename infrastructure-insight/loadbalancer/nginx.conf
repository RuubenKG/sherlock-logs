upstream webservers {
    least_conn;
    server 192.168.56.11:80;
    server 192.168.56.12:80;
}

server {
    listen 80;

    location /api/ {
        proxy_pass http://webservers;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header X-Served-By $upstream_addr;
    }

    location / {
        proxy_pass http://webservers;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header X-Served-By $upstream_addr;
    }
}